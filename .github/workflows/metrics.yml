name: metrics

# Renders GitHub stats as SVG files committed INTO this repo.
# Why not the usual github-readme-stats badge: its public instance is a shared
# Vercel deployment that is regularly rate-limited (503) or out of quota (402).
# Generating in-repo means the README never shows a broken image.

on:
  schedule:
    - cron: "17 4 * * *"      # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Main card: header + activity + repositories ──────────────────
      - name: Overview card
        uses: lowlighter/metrics@v3.34
        with:
          # METRICS_TOKEN (a classic PAT with `repo`) also counts private
          # contributions. Falls back to the built-in token if absent.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Archangel-gabri
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          config_display: large
          config_animations: yes
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

      # ── Language breakdown, weighted by lines of code ────────────────
      - name: Languages card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Archangel-gabri
          filename: metrics/metrics.languages.svg
          base: ""
          config_timezone: Europe/Moscow
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
