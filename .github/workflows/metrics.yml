name: metrics

# Renders GitHub stats as SVG files committed INTO this repo.
# Why not the usual github-readme-stats badge: its public instance is a shared
# Vercel deployment that is regularly rate-limited (503) or out of quota (402).
# Generating in-repo means the README never shows a broken image.
#
# Plugin choice is deliberate: `habits` and `achievements` both need a personal
# access token and render "Unexpected error" on the built-in GITHUB_TOKEN, so
# they stay out until METRICS_TOKEN exists.

on:
  schedule:
    - cron: "17 4 * * *"      # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # One card, not two: the `languages` plugin reads the repository list
      # that `base` loads, so a second card with `base: ""` renders empty.
      - name: Overview card
        uses: lowlighter/metrics@v3.34
        with:
          # METRICS_TOKEN (classic PAT with `repo`) also counts private
          # contributions. Falls back to the built-in token if absent.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Archangel-gabri
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, repositories
          repositories: 100
          config_timezone: Europe/Moscow
          config_animations: yes
          plugin_lines: yes
          # No isocalendar here: the README already shows a contribution graph
          # and a 3D calendar, and its light grid clashes with the dark palette.
          #
          # Everything below needs METRICS_TOKEN (a PAT). On the built-in Actions
          # token these render empty or as "Unexpected error", because that token
          # is scoped to this repository rather than to the user.
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
